<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>快截</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <div class="titlebar">
        <span class="titlebar-brand" data-tauri-drag-region>
          <span class="titlebar-icon" data-tauri-drag-region>✂</span>
          <span class="titlebar-title" data-tauri-drag-region>快截</span>
          <span class="titlebar-tag" data-tauri-drag-region data-i18n="app.tag">截图 · 录屏 · GIF</span>
        </span>
        <div class="titlebar-btns">
          <button id="tb-min" data-i18n-title="titlebar.min" title="最小化">—</button>
          <button id="tb-max" data-i18n-title="titlebar.max" title="最大化 / 还原">▢</button>
          <button id="tb-close" class="close" data-i18n-title="titlebar.close" title="关闭（最小化到托盘）">✕</button>
        </div>
      </div>

      <div class="main-body">
        <aside class="sidebar">
          <button class="side-item active" id="tab-home" data-i18n-title="tab.home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
            <span data-i18n="tab.home">首页</span>
          </button>
          <button class="side-item" id="tab-history" data-i18n-title="tab.history">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span data-i18n="tab.history">历史记录</span>
          </button>
          <div class="side-spacer"></div>
          <button class="side-item" id="tab-about" data-i18n-title="tab.about">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            <span data-i18n="tab.about">关于</span>
          </button>
          <button class="side-item" id="tab-settings" data-i18n-title="tab.settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span data-i18n="tab.settings">设置</span>
          </button>
        </aside>

        <main class="content">
          <section id="view-home">
            <div class="hero">
              <div class="hero-text">
                <h2 data-i18n="home.heroTitle">一站式截图录屏工具</h2>
                <p data-i18n="home.heroSub">简单 · 快捷 · 强大</p>
              </div>
              <div class="hero-slogan" data-i18n="home.slogan">捕捉灵感 记录美好！</div>
            </div>
            <div class="action-cards">
              <button class="action-card card-green" id="btn-region">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/><rect x="6" y="6" width="12" height="12" rx="1" stroke-dasharray="3 3"/></svg>
                <div class="card-text">
                  <span class="card-name" data-i18n="app.screenshot">区域截图</span>
                  <kbd class="hk-chip" id="hk-chip-region">Ctrl+Shift+A</kbd>
                </div>
              </button>
              <button class="action-card card-blue" id="btn-full">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                <div class="card-text">
                  <span class="card-name" data-i18n="app.fullscreen">全屏截图</span>
                </div>
              </button>
              <button class="action-card card-teal" id="btn-video">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="13" height="12" rx="2"/><path d="m15 10 7-3.5v11L15 14"/></svg>
                <div class="card-text">
                  <span class="card-name" data-i18n="app.video">录屏</span>
                  <kbd class="hk-chip" id="hk-chip-video">Ctrl+Shift+R</kbd>
                </div>
              </button>
              <button class="action-card card-purple" id="btn-gif">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><text x="12" y="15.5" font-size="7" font-weight="bold" text-anchor="middle" fill="currentColor" stroke="none">GIF</text></svg>
                <div class="card-text">
                  <span class="card-name">GIF</span>
                  <kbd class="hk-chip" id="hk-chip-gif">Ctrl+Shift+G</kbd>
                </div>
              </button>
              <button class="action-card card-orange" id="btn-color">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m2 22 1-4h0l9.5-9.5 3 3L6 21H2z"/><path d="M14.5 4.5 17 2l5 5-2.5 2.5z"/><path d="M17 2l5 5"/></svg>
                <div class="card-text">
                  <span class="card-name" data-i18n="app.color">取色</span>
                  <kbd class="hk-chip" id="hk-chip-color">Ctrl+Shift+C</kbd>
                </div>
              </button>
            </div>
          </section>

          <section id="view-history" hidden>
            <div class="view-header">
              <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
                <input id="search-input" data-i18n-placeholder="history.search" placeholder="搜索文件名、类型…" />
              </div>
              <span id="save-path" class="save-path"></span>
              <button id="btn-open-folder" class="icon-btn" data-i18n-title="history.openFolder" title="打开保存目录">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              </button>
              <div class="view-toggle">
                <button id="view-list-btn" class="icon-btn" data-i18n-title="history.listView" title="列表视图">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>
                </button>
                <button id="view-grid-btn" class="icon-btn active" data-i18n-title="history.gridView" title="网格视图">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                </button>
              </div>
            </div>
            <div id="history" class="grid"></div>
            <div id="empty" class="empty">
              <p data-i18n="history.empty">还没有内容</p>
              <p class="hint" id="empty-hint">按 <kbd>Ctrl+Shift+A</kbd> 或点击「区域截图」开始</p>
            </div>
          </section>

          <section id="view-about" hidden>
            <div class="about">
              <div class="about-logo">✂</div>
              <h2>快截</h2>
              <p class="about-ver"><span data-i18n="about.version">版本</span> <span id="about-version">-</span></p>
              <p class="about-desc" data-i18n="about.desc">截图 · 录屏 · GIF 工具</p>
              <p class="about-tech" data-i18n="about.tech">基于 Tauri + Rust 构建，视频编码由 FFmpeg (LGPL) 提供</p>
              <a id="btn-licenses" class="link" data-i18n="about.license">第三方组件许可证</a>
              <p class="about-copy" data-i18n="about.copyright">© 2026 KuaiJie. 保留所有权利。</p>
            </div>
          </section>

        <section id="view-settings" hidden>
          <div class="form">
            <div class="form-row">
              <label data-i18n="settings.language">语言 / Language</label>
              <div class="form-field">
                <select id="set-language">
                  <option value="zh-CN">简体中文</option>
                  <option value="zh-TW">繁體中文</option>
                  <option value="en">English</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <label data-i18n="settings.saveDir">保存目录</label>
              <div class="form-field">
                <span id="set-save-dir" class="path-text"></span>
                <button id="btn-browse" class="btn small" data-i18n="settings.browse">浏览…</button>
                <button id="btn-reset-dir" class="btn small" data-i18n="settings.reset">恢复默认</button>
              </div>
            </div>

            <div class="form-row">
              <label data-i18n="settings.autostart">开机自启</label>
              <div class="form-field">
                <label class="switch">
                  <input type="checkbox" id="set-autostart" />
                  <span class="slider"></span>
                </label>
                <span class="form-hint" data-i18n="settings.autostartHint">登录 Windows 后自动运行（托盘常驻）</span>
              </div>
            </div>

            <div class="form-row">
              <label data-i18n="settings.hotkeyScreenshot">热键 · 区域截图</label>
              <div class="form-field">
                <input id="hk-screenshot" class="hotkey-input" readonly data-i18n-placeholder="settings.hotkeyPlaceholder" placeholder="点击后按下快捷键" />
              </div>
            </div>
            <div class="form-row">
              <label data-i18n="settings.hotkeyVideo">热键 · 录屏</label>
              <div class="form-field">
                <input id="hk-video" class="hotkey-input" readonly data-i18n-placeholder="settings.hotkeyPlaceholder" placeholder="点击后按下快捷键" />
              </div>
            </div>
            <div class="form-row">
              <label data-i18n="settings.hotkeyGif">热键 · GIF</label>
              <div class="form-field">
                <input id="hk-gif" class="hotkey-input" readonly data-i18n-placeholder="settings.hotkeyPlaceholder" placeholder="点击后按下快捷键" />
              </div>
            </div>
            <div class="form-row">
              <label data-i18n="settings.hotkeyColor">热键 · 取色</label>
              <div class="form-field">
                <input id="hk-color" class="hotkey-input" readonly data-i18n-placeholder="settings.hotkeyPlaceholder" placeholder="点击后按下快捷键" />
              </div>
            </div>

            <div class="form-row">
              <label data-i18n="settings.gifFps">GIF 帧率</label>
              <div class="form-field">
                <select id="set-gif-fps">
                  <option value="5" data-opt="opt.small">5 fps</option>
                  <option value="10" data-opt="opt.rec">10 fps</option>
                  <option value="15" data-opt="opt.smooth">15 fps</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <label data-i18n="settings.gifWidth">GIF 最大宽度</label>
              <div class="form-field">
                <select id="set-gif-width">
                  <option value="360" data-opt="opt.small">360 px</option>
                  <option value="480" data-opt="opt.rec">480 px</option>
                  <option value="640" data-opt="opt.clear">640 px</option>
                  <option value="960" data-opt="opt.hd">960 px</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <label data-i18n="settings.videoFps">录屏帧率</label>
              <div class="form-field">
                <select id="set-video-fps">
                  <option value="10" data-opt="opt.small">10 fps</option>
                  <option value="15" data-opt="opt.rec">15 fps</option>
                  <option value="30" data-opt="opt.smooth">30 fps</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <label data-i18n="settings.videoBitrate">录屏码率</label>
              <div class="form-field">
                <select id="set-video-bitrate">
                  <option value="1500" data-opt-bitrate="opt.bitrateLow" data-mbps="1.5">低</option>
                  <option value="2500" data-opt-bitrate="opt.bitrateMid" data-mbps="2.5">中</option>
                  <option value="5000" data-opt-bitrate="opt.bitrateHigh" data-mbps="5">高</option>
                </select>
              </div>
            </div>

            <p class="form-note" data-i18n="settings.note">所有设置即时保存。修改热键后若提示被占用，请换一组组合键。</p>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
