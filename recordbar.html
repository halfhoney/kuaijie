<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>录制中</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }
      .bar {
        width: 100%; height: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        background: rgba(20, 22, 28, 0.95);
        border: 1px solid #3a3f4d;
        border-radius: 999px;
        color: #e6e8ee;
      }
      .dot {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: #ef4444;
        animation: blink 1.2s ease-in-out infinite;
        flex-shrink: 0;
      }
      .dot.paused { background: #f59e0b; animation: none; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      #status { font-size: 13px; color: #f87171; flex-shrink: 0; }
      #status.paused { color: #f59e0b; }
      #timer {
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        flex: 1;
      }
      .btn {
        padding: 6px 12px;
        border: none;
        border-radius: 999px;
        font-size: 13px;
        cursor: pointer;
        flex-shrink: 0;
        font-family: inherit;
      }
      #pause { background: #2a2f3a; color: #e6e8ee; }
      #pause:hover { background: #3a3f4d; }
      #stop { background: #ef4444; color: #fff; }
      #stop:hover { background: #dc2626; }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="dot" id="dot"></span>
      <span id="status">录制中</span>
      <span id="timer">00:00</span>
      <button id="pause" class="btn">⏸ 暂停</button>
      <button id="stop" class="btn">■ 停止</button>
    </div>
    <script type="module" src="/src/recordbar.ts"></script>
  </body>
</html>
